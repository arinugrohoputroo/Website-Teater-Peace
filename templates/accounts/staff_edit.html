{% extends 'panel_base.html' %}

{% block title %}Edit {{ staff.name }} — {{ event_name }}{% endblock %}

{% block content %}
<div class="max-w-lg">
    <div class="mb-6">
        <a href="{% url 'accounts:staff_list' %}" class="text-sm text-gray-500 hover:text-gray-700">&larr; Kembali</a>
        <h1 class="text-2xl font-bold text-gray-900 mt-2">Edit Panitia</h1>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" value="{{ staff.username }}" disabled class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
                <input type="text" name="name" value="{{ staff.name }}" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" value="{{ staff.email }}" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">No. WhatsApp</label>
                <input type="tel" name="phone" value="{{ staff.phone }}" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                <select name="role" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-colors">
                    <option value="STAFF" {% if staff.role == 'STAFF' %}selected{% endif %}>Staff</option>
                    <option value="ADMIN" {% if staff.role == 'ADMIN' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-xl font-medium hover:bg-primary-700 transition-colors">
                Simpan
            </button>
        </form>
    </div>

    <!-- Reset Password -->
    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm mt-6">
        <h2 class="font-semibold text-lg mb-4">Reset Password</h2>
        <form method="post" action="{% url 'accounts:staff_reset_password' staff.pk %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password Baru</label>
                <input type="password" name="password" required minlength="8" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-colors" placeholder="Minimal 8 karakter">
            </div>
            <button type="submit" class="w-full py-3 bg-orange-500 text-white rounded-xl font-medium hover:bg-orange-600 transition-colors">
                Reset Password
            </button>
        </form>
    </div>
</div>
{% endblock %}

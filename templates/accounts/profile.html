{% extends 'panel_base.html' %}

{% block title %}Profil — {{ event_name }}{% endblock %}

{% block content %}
<div class="max-w-lg">
    <h1 class="text-2xl font-bold mb-6">Profil</h1>
    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 rounded-full bg-primary-100 flex items-center justify-center text-2xl font-bold text-primary-700">
                {{ request.user.name|truncatechars:1 }}
            </div>
            <div>
                <h2 class="text-lg font-semibold">{{ request.user.name }}</h2>
                <p class="text-sm text-gray-500">{{ request.user.email }}</p>
                <p class="text-xs text-gray-400">@{{ request.user.username }}</p>
                <span class="inline-block mt-1 text-xs px-2 py-0.5 rounded-full {% if request.user.is_admin %}bg-purple-100 text-purple-700{% elif request.user.role == 'STAFF' %}bg-blue-100 text-blue-700{% else %}bg-gray-100 text-gray-600{% endif %}">
                    {{ request.user.get_role_display }}
                </span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

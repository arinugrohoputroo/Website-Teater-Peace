{% extends 'base.html' %}

{% block title %}Login — {{ event_name }}{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-primary-50 to-white">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🎭</div>
            <h1 class="text-2xl font-bold text-gray-900">Panel Panitia</h1>
            <p class="text-gray-500 mt-2">Masuk untuk melanjutkan</p>
        </div>

        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
            <div class="p-4 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200{% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" name="username" required autofocus
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-colors"
                        placeholder="Username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-colors"
                        placeholder="Password">
                </div>
                <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-xl font-medium hover:bg-primary-700 transition-colors">
                    Masuk
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-gray-400 mt-6">
            <a href="{% url 'core:home' %}" class="hover:text-gray-600">&larr; Kembali ke website</a>
        </p>
    </div>
</div>
{% endblock %}

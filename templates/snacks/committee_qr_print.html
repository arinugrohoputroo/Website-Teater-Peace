<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Cetak QR Panitia — Teater Peace</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Georgia, 'Times New Roman', serif; margin: 0; padding: 16px; background: #fff; color: #111; }
        .toolbar { margin-bottom: 16px; display: flex; gap: 8px; }
        .toolbar button, .toolbar a {
            display: inline-block; padding: 10px 16px; background: #111; color: #fff;
            text-decoration: none; border: 0; border-radius: 8px; cursor: pointer; font-family: sans-serif;
        }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .card {
            border: 2px solid #111; border-radius: 12px; padding: 20px; text-align: center;
            page-break-inside: avoid; min-height: 340px;
        }
        .brand { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
        .name { font-size: 18px; font-weight: bold; margin: 0 0 4px; }
        .id { font-family: ui-monospace, monospace; font-size: 13px; margin-bottom: 12px; }
        .qr { width: 180px; height: 180px; margin: 0 auto; }
        .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
        @media print {
            .toolbar { display: none; }
            body { padding: 0; }
            .grid { gap: 12px; }
        }
        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button onclick="window.print()">Print</button>
        <a href="{% url 'snacks:committee_qr_list' %}">Kembali</a>
    </div>
    <div class="grid">
        {% for card in cards %}
        <div class="card">
            <div class="brand">Teater Peace</div>
            <p class="name">{{ card.member.name }}</p>
            <p class="id">ID PANITIA: {{ card.member.member_code }}</p>
            <div class="qr"><img src="{{ card.qr_data_uri }}" alt="QR {{ card.member.member_code }}"></div>
        </div>
        {% endfor %}
    </div>
</body>
</html>

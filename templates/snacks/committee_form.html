{% extends 'panel_base.html' %}

{% block title %}{{ form_title }} — {{ event_name }}{% endblock %}

{% block content %}
<div class="max-w-lg">
    <a href="{% url 'snacks:committee_list' %}" class="text-sm text-gray-500 hover:text-gray-700">&larr; Kembali</a>
    <h1 class="text-2xl font-bold text-gray-900 mt-2 mb-6">{{ form_title }}</h1>

    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                <input type="text" name="name" required value="{{ member.name|default:'' }}" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-400 outline-none">
            </div>
            {% if member %}
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="active" {% if member.active %}checked{% endif %}>
                Aktif
            </label>
            {% endif %}
            <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-xl font-medium hover:bg-primary-700">Simpan</button>
        </form>
    </div>
</div>
{% endblock %}

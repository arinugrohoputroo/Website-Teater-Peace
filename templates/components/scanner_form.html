<div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ token_label|default:"QR Token / Hasil Scanner" }}</label>
            <input type="text" name="{{ token_name|default:'token' }}" class="w-full px-4 py-4 rounded-xl border border-gray-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-colors" placeholder="{{ token_placeholder|default:'Tempel hasil scanner atau token' }}">
        </div>
        {% if show_ticket_number %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nomor Tiket</label>
            <input type="text" name="ticket_number" maxlength="4" class="w-full px-4 py-4 rounded-xl border border-gray-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-colors" placeholder="0001">
        </div>
        {% endif %}
        <button type="submit" class="w-full py-4 bg-primary-600 text-white rounded-xl font-semibold hover:bg-primary-700 transition-colors">
            {{ button_label|default:"Proses Scanner" }}
        </button>
    </form>
</div>

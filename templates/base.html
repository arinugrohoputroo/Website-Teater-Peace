<!DOCTYPE html>
<html lang="id" class="h-full antialiased selection:bg-amber-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>{% block title %}{{ event_name }}{% endblock %}</title>
    
    <!-- Google Fonts: Montserrat (Cinema XXI style) & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Montserrat"', '"Plus Jakarta Sans"', 'sans-serif'],
                        cinema: ['"Montserrat"', 'sans-serif'],
                    },
                    colors: {
                        primary: { 
                            50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 
                            400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 
                            800: '#86198f', 900: '#701a75', 950: '#4a044e' 
                        },
                        amber: { 
                            50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 
                            400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 
                            800: '#92400e', 900: '#78350f' 
                        },
                    },
                    boxShadow: {
                        'glow-amber': '0 0 30px -5px rgba(245, 158, 11, 0.35)',
                        'glow-primary': '0 0 30px -5px rgba(192, 38, 211, 0.3)',
                        'card-hover': '0 20px 35px -10px rgba(0, 0, 0, 0.07), 0 8px 15px -6px rgba(0, 0, 0, 0.03)',
                        'cinema': '0 10px 30px -5px rgba(0, 0, 0, 0.06), 0 4px 10px -2px rgba(0, 0, 0, 0.02)',
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        
        body {
            font-family: 'Montserrat', 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #ffffff;
            color: #0f172a;
        }

        /* Ambient light glows for clean white pages */
        .ambient-light-glow {
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(254, 243, 199, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(250, 232, 255, 0.4) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(241, 245, 249, 0.8) 0%, transparent 60%);
        }

        /* Smooth scroll & Custom Scrollbar */
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Interactive card elevation & hover effects */
        .interactive-card {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .interactive-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08);
        }

        /* Mobile Touch Ripple / Press scale effect */
        .btn-touch {
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }
        .btn-touch:active {
            transform: scale(0.97);
        }

        /* Keyframe pulse glow */
        @keyframes subtle-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.03); }
        }
        .animate-subtle-glow {
            animation: subtle-glow 6s infinite ease-in-out;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-white text-slate-900 antialiased selection:bg-amber-500 selection:text-white">
    {% block body %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="id" class="h-full antialiased selection:bg-purple-600 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#701a75">
    <title>{% block title %}{{ event_name }}{% endblock %}</title>
    
    <!-- Google Fonts: Montserrat & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Montserrat"', '"Plus Jakarta Sans"', 'sans-serif'],
                        cinema: ['"Montserrat"', 'sans-serif'],
                    },
                    colors: {
                        primary: { 
                            50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 
                            400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 
                            800: '#86198f', 900: '#701a75', 950: '#4a044e' 
                        },
                        amber: { 
                            50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 
                            400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 
                            800: '#92400e', 900: '#78350f' 
                        },
                    },
                    boxShadow: {
                        'glow-purple': '0 0 25px -3px rgba(192, 38, 211, 0.35)',
                        'glow-amber': '0 0 25px -3px rgba(245, 158, 11, 0.35)',
                        'card-colored': '0 10px 30px -5px rgba(192, 38, 211, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03)',
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        
        body {
            font-family: 'Montserrat', 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #faf5ff;
            color: #0f172a;
        }

        /* Elegant light ambient glow */
        .ambient-canvas {
            background-color: #faf5ff;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(250, 232, 255, 0.7) 0%, transparent 45%),
                radial-gradient(circle at 90% 20%, rgba(254, 243, 199, 0.6) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(245, 208, 254, 0.4) 0%, transparent 60%);
        }

        /* Smooth scroll & Custom Scrollbar */
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #fdf4ff; }
        ::-webkit-scrollbar-thumb { background: #f0abfc; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #c026d3; }

        /* Colored Liz (border) cards */
        .card-liz-purple {
            background: #ffffff;
            border: 1.5px solid rgba(192, 38, 211, 0.18);
            box-shadow: 0 10px 30px -8px rgba(112, 26, 117, 0.06);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card-liz-purple:hover {
            border-color: rgba(192, 38, 211, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 18px 36px -10px rgba(192, 38, 211, 0.15);
        }

        .card-liz-amber {
            background: #ffffff;
            border: 1.5px solid rgba(245, 158, 11, 0.25);
            box-shadow: 0 10px 30px -8px rgba(217, 119, 6, 0.06);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card-liz-amber:hover {
            border-color: rgba(245, 158, 11, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 18px 36px -10px rgba(245, 158, 11, 0.15);
        }

        /* Gradient Button Styles (NO BLACK BUTTONS) */
        .btn-gradient-primary {
            background: linear-gradient(135deg, #c026d3 0%, #a21caf 50%, #701a75 100%);
            color: #ffffff;
            box-shadow: 0 8px 20px -4px rgba(192, 38, 211, 0.35);
            transition: all 0.2s ease;
        }
        .btn-gradient-primary:hover {
            background: linear-gradient(135deg, #d946ef 0%, #c026d3 50%, #a21caf 100%);
            box-shadow: 0 12px 25px -4px rgba(192, 38, 211, 0.5);
        }

        .btn-gradient-amber {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            box-shadow: 0 8px 20px -4px rgba(245, 158, 11, 0.35);
            transition: all 0.2s ease;
        }
        .btn-gradient-amber:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 12px 25px -4px rgba(245, 158, 11, 0.5);
        }

        /* Touch scale effect */
        .btn-touch {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-touch:active {
            transform: scale(0.97);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-purple-50/40 text-slate-900 antialiased selection:bg-purple-600 selection:text-white">
    {% block body %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>

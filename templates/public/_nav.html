{% load static %}
<nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 py-3">
        <div class="flex items-center justify-between gap-3">
            <a href="/" class="flex items-center gap-3 group">
                <img src="{% static 'img/logo-event.png' %}" alt="{{ event_name }}" class="w-9 h-9 rounded-full object-cover border border-slate-200">
                <div>
                    <p class="font-extrabold text-slate-900 leading-tight text-sm tracking-tight group-hover:text-primary-600 transition-colors">{{ event_name }}</p>
                    <p class="text-[10px] text-slate-500 font-medium">Gelar Karya Ke-28</p>
                </div>
            </a>

            <div class="flex items-center gap-2">
                <a href="/" class="hidden md:inline-flex px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors">Home</a>
                <a href="{% url 'public_order:ticket_select' %}" class="px-3 py-1.5 text-xs font-semibold text-slate-700 hover:text-slate-900 transition-colors">Tiket</a>
                
                {% if session_buyer_phone %}
                <a href="{% url 'public_order:my_history' %}" class="px-3 py-1.5 text-xs font-bold text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                    Tiket Saya
                </a>
                <a href="{% url 'public_order:buyer_logout' %}" title="Keluar" class="px-2 py-1.5 text-xs text-slate-400 hover:text-red-600 transition-colors font-medium">
                    Keluar
                </a>
                {% else %}
                <a href="{% url 'public_order:buyer_login' %}" class="px-3 py-1.5 text-xs font-bold text-slate-700 hover:text-slate-900 transition-colors">
                    Masuk
                </a>
                {% endif %}
                
                <a href="{% url 'public_order:ticket_select' %}" class="inline-flex px-3.5 py-1.5 text-xs font-bold text-white bg-slate-900 hover:bg-slate-800 rounded-lg transition-colors shadow-xs">
                    Beli Tiket
                </a>
                
                {% if request.user.is_authenticated and request.user.is_panitia %}
                <a href="{% url 'dashboard:index' %}" class="px-3 py-1.5 text-xs font-bold text-primary-700 bg-primary-50 hover:bg-primary-100 rounded-lg transition-colors">
                    Panitia
                </a>
                {% else %}
                <a href="{% url 'login' %}" class="px-2.5 py-1.5 text-xs font-medium text-slate-500 hover:text-slate-800 transition-colors">
                    Panitia
                </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

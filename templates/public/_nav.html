{% load static %}
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-xl border-b border-purple-100 shadow-xs">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 h-16 flex items-center justify-between gap-2">
        <!-- Brand Logo & Title -->
        <a href="/" class="flex items-center gap-2 shrink-0 group min-w-0">
            <img src="{% static 'img/logo-event.png' %}" alt="{{ event_name }}" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full object-cover border border-purple-200 shadow-xs shrink-0 group-hover:scale-105 transition-transform">
            <div class="min-w-0">
                <p class="font-bold text-slate-900 leading-tight text-xs sm:text-sm tracking-tight truncate group-hover:text-purple-700 transition-colors max-w-[130px] sm:max-w-none">{{ event_name }}</p>
                <p class="text-[9px] sm:text-[10px] font-medium text-purple-600 tracking-wide truncate">Gelar Karya Ke-28</p>
            </div>
        </a>

        <!-- Right Actions (Clean Responsive Flex with whitespace-nowrap) -->
        <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0 whitespace-nowrap">
            <a href="{% url 'public_order:ticket_select' %}" class="hidden md:inline-flex px-2 py-1.5 text-xs font-semibold text-slate-700 hover:text-purple-700 transition-colors">
                Tiket
            </a>

            {% if session_buyer_phone %}
            <a href="{% url 'public_order:my_history' %}" class="px-2.5 py-1.5 text-[11px] sm:text-xs font-semibold text-purple-900 bg-purple-50 hover:bg-purple-100 rounded-lg border border-purple-200 transition-colors">
                Tiket Saya
            </a>
            <a href="{% url 'public_order:buyer_logout' %}" title="Keluar" class="px-1 py-1 text-xs font-semibold text-slate-400 hover:text-red-600 transition-colors">
                ✕
            </a>
            {% else %}
            <a href="{% url 'public_order:buyer_login' %}" class="px-2 py-1.5 text-[11px] sm:text-xs font-semibold text-slate-700 hover:text-purple-700 transition-colors">
                Masuk
            </a>
            {% endif %}

            <a href="{% url 'public_order:ticket_select' %}" class="px-3 sm:px-4 py-1.5 btn-gradient-primary rounded-lg font-semibold text-xs shadow-xs active:scale-95 btn-touch">
                Beli
            </a>

            <!-- Panitia Button (Clean outline pill) -->
            {% if request.user.is_authenticated and request.user.is_panitia %}
            <a href="{% url 'dashboard:index' %}" class="px-2.5 sm:px-3 py-1.5 text-[11px] sm:text-xs font-bold text-amber-900 bg-amber-50 hover:bg-amber-100 rounded-lg border border-amber-300 transition-colors">
                Panitia
            </a>
            {% else %}
            <a href="{% url 'login' %}" class="px-2.5 sm:px-3 py-1.5 text-[11px] sm:text-xs font-semibold text-purple-900 bg-purple-50/80 hover:bg-purple-100 rounded-lg border border-purple-200 transition-colors">
                Panitia
            </a>
            {% endif %}
        </div>
    </div>
</header>

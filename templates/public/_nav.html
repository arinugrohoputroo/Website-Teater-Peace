{% load static %}
<header class="sticky top-0 z-50 bg-white/85 backdrop-blur-xl border-b border-navy-100/60 transition-shadow duration-300" id="site-nav">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-[4.25rem] flex items-center justify-between gap-3">
        <a href="/" class="flex items-center gap-2.5 shrink-0 group min-w-0">
            <img src="{% static 'img/logo-event.png' %}" alt="{{ event_name }}"
                class="relative w-9 h-9 sm:w-10 sm:h-10 rounded-full object-cover logo-ring group-hover:scale-105 transition-transform duration-300 shrink-0">
            <div class="min-w-0">
                <p class="font-display text-sm sm:text-base font-semibold text-navy-800 leading-tight truncate group-hover:text-navy-950 transition-colors">Gelar Karya Ke-28</p>
                <p class="text-[10px] font-medium text-gold-600 tracking-wide truncate italic">Mengukir Mimpi</p>
            </div>
        </a>

        <div class="flex items-center gap-1 sm:gap-2 shrink-0">
            <a href="{% url 'public_order:ticket_select' %}" class="hidden md:inline-flex px-3 py-2 text-xs font-semibold text-navy-600 hover:text-navy-900 nav-link">
                Tiket
            </a>

            {% if session_buyer_phone %}
            <a href="{% url 'public_order:my_history' %}" class="px-3 py-2 text-[11px] sm:text-xs font-semibold text-navy-800 bg-navy-50/80 hover:bg-navy-100/60 rounded-xl border border-navy-100 transition-all duration-200">
                Tiket Saya
            </a>
            <a href="{% url 'public_order:buyer_logout' %}" title="Keluar" class="p-2 text-navy-300 hover:text-red-500 transition-colors rounded-lg hover:bg-red-50/50">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            </a>
            {% else %}
            <a href="{% url 'public_order:buyer_login' %}" class="hidden sm:inline-flex px-3 py-2 text-xs font-semibold text-navy-600 hover:text-navy-900 nav-link">
                Masuk
            </a>
            {% endif %}

            <a href="{% url 'public_order:ticket_select' %}" class="px-4 sm:px-5 py-2 btn-gradient-primary rounded-xl text-xs btn-touch">
                Beli Tiket
            </a>

            {% if request.user.is_authenticated and request.user.is_panitia %}
            <a href="{% url 'dashboard:index' %}" class="hidden sm:inline-flex px-3 py-2 text-[11px] font-bold text-navy-800 bg-gold-100/80 hover:bg-gold-200/60 rounded-xl border border-gold-300/50 transition-colors">
                Panitia
            </a>
            {% else %}
            <a href="{% url 'login' %}" class="hidden sm:inline-flex px-3 py-2 text-[11px] font-semibold text-navy-600 hover:text-navy-900 hover:bg-navy-50/60 rounded-xl transition-colors">
                Panitia
            </a>
            {% endif %}
        </div>
    </div>
</header>
<script>
(function() {
    var nav = document.getElementById('site-nav');
    if (!nav) return;
    window.addEventListener('scroll', function() {
        nav.classList.toggle('shadow-sm', window.scrollY > 8);
    }, { passive: true });
})();
</script>

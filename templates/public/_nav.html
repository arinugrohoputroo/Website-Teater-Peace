{% load static %}
<nav class="bg-white/90 backdrop-blur-md border-b border-gray-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3">
        <div class="flex items-center justify-between gap-4">
            <a href="/" class="flex items-center gap-3 min-w-0 group">
                <img src="{% static 'img/logo-event.png' %}" alt="{{ event_name }}" class="w-11 h-11 rounded-full object-cover ring-2 ring-primary-100 group-hover:ring-primary-200 transition-all shrink-0">
                <div class="min-w-0 hidden sm:block">
                    <p class="font-bold text-primary-800 leading-tight truncate">{{ event_name }}</p>
                    <p class="text-[11px] text-gray-500 truncate">Gelar Karya Ke-28</p>
                </div>
            </a>

            <div class="flex items-center gap-1 sm:gap-2">
                <a href="/" class="hidden md:inline-flex px-3 py-2 text-sm font-medium text-gray-600 hover:text-primary-700 hover:bg-primary-50 rounded-lg transition-colors">Home</a>
                <a href="{% url 'public_order:ticket_select' %}" class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-primary-700 hover:bg-primary-50 rounded-lg transition-colors">Tiket</a>
                <a href="{% url 'public_order:order_status' %}" class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-primary-700 hover:bg-primary-50 rounded-lg transition-colors">Cek Order</a>
                <a href="{% url 'public_order:ticket_select' %}" class="hidden sm:inline-flex px-4 py-2 text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 rounded-lg transition-colors shadow-sm shadow-primary-200">Beli Tiket</a>
                {% if request.user.is_authenticated and request.user.is_panitia %}
                <a href="{% url 'dashboard:index' %}" class="px-3 py-2 text-sm font-medium text-primary-700 border border-primary-200 bg-primary-50 hover:bg-primary-100 rounded-lg transition-colors">Panitia</a>
                {% else %}
                <a href="{% url 'login' %}" class="px-3 py-2 text-sm font-medium text-gray-600 border border-gray-200 hover:border-primary-200 hover:text-primary-700 hover:bg-primary-50 rounded-lg transition-colors">Panitia</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

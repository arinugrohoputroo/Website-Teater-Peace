{% extends 'panel_base.html' %}

{% block title %}{{ form_title }} — {{ event_name }}{% endblock %}

{% block content %}
<div class="max-w-xl">
    <a href="{% url 'ticketing:ticket_types' %}" class="text-sm text-gray-500 hover:text-gray-700">&larr; Kembali</a>
    <h1 class="text-2xl font-bold text-gray-900 mt-2 mb-6">{{ form_title }}</h1>

    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
                <input type="text" name="name" required value="{{ ticket_type.name|default:'' }}" class="w-full px-4 py-3 rounded-xl border border-gray-200">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Harga 1 Tiket</label>
                    <input type="number" name="price" required min="0" value="{{ ticket_type.price|default:'' }}" class="w-full px-4 py-3 rounded-xl border border-gray-200">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Harga 2 Tiket</label>
                    <input type="number" name="bundle_price" required min="0" value="{{ ticket_type.bundle_price|default:'' }}" class="w-full px-4 py-3 rounded-xl border border-gray-200">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kuota</label>
                <input type="number" name="quota" required min="1" value="{{ ticket_type.quota|default:'' }}" class="w-full px-4 py-3 rounded-xl border border-gray-200">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                <textarea name="description" rows="3" class="w-full px-4 py-3 rounded-xl border border-gray-200">{{ ticket_type.description|default:'' }}</textarea>
            </div>
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="active" {% if ticket_type is None or ticket_type.active %}checked{% endif %}>
                Aktif
            </label>
            <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-xl font-medium hover:bg-primary-700">Simpan</button>
        </form>
    </div>
</div>
{% endblock %}
